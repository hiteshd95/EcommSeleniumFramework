version: '3.8'

# 1. This block replaces: docker network create grid
networks:
  grid:
    driver: bridge

services:
  # 2. This block replaces your selenium-hub run command
  selenium-hub:
    image: selenium/hub:latest
    container_name: selenium-hub
    ports:
      - "4442-4444:4442-4444"
    networks:
      - grid

  # 3. This block replaces your chrome-node run command
  chrome-node:
    image: selenium/node-chrome:latest
    container_name: chrome-node
    shm_size: '2gb' # Fixed memory allocation to prevent crashes
    depends_on:
      - selenium-hub
    environment:
      - SE_EVENT_BUS_HOST=selenium-hub
      - SE_EVENT_BUS_PUBLISH_PORT=4442
      - SE_EVENT_BUS_SUBSCRIBE_PORT=4443
    networks:
      - grid

  # 4. This block replaces your firefox-node run command
  firefox-node:
    image: selenium/node-firefox:latest
    container_name: firefox-node
    shm_size: '2gb'
    depends_on:
      - selenium-hub
    environment:
      - SE_EVENT_BUS_HOST=selenium-hub
      - SE_EVENT_BUS_PUBLISH_PORT=4442
      - SE_EVENT_BUS_SUBSCRIBE_PORT=4443
    networks:
      - grid
